name: CI

on:
  push:
    branches: [ ci ]

  workflow_dispatch:

jobs:
  test-api:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: API
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test

  test-mobile:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: Mobile
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test || echo 'Mobile tests skipped'

  test-ui:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: UI
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test || echo 'UI tests skipped'

  test-performance:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: Performance
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Build scripts
        run: npm run pretest
      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg2
          curl -fsSL https://dl.k6.io/key.gpg | gpg --dearmor | sudo tee /usr/share/keyrings/k6-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      - name: Run k6 tests
        run: k6 run dist/login.test.js
